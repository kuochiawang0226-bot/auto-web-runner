name: Daily website test
run-name: "${{ github.event_name == 'schedule' && 'watchdog' || ((inputs.mode == 'status' || inputs.mode == 'check_ip') && 'inspect' || 'worker') }} | ${{ inputs.mode || 'schedule' }} | ${{ inputs.batch_id }}"
on:
  schedule:
    # 台灣 08:15～23:15，每 30 分鐘檢查一次；實際啟動仍可能延遲。
    - cron: '15,45 0-14 * * *'
    - cron: '15 15 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'execute 排程；execute_now 立即續跑；status 查進度；check_ip 查IP；resume 自動備援專用'
        type: choice
        options: [check_ip, execute, execute_now, status, resume]
        default: check_ip
      batch_id:
        description: '批次名稱（續跑沿用；新資料才換名稱）'
        default: batch-001
        required: true
        type: string
      start_row:
        description: '起始 Excel 列號'
        default: '2'
        required: true
        type: string
      end_row:
        description: '最後列號；0 表示讀到 A 欄空白'
        default: '0'
        required: true
        type: string
      max_retries:
        description: '每筆重複 IP 的額外重試上限（0–20）'
        default: '5'
        required: true
        type: string
      max_runs:
        description: '每輪工作次數上限，含重複 IP（1–5000）'
        default: '5000'
        required: true
        type: string
      max_rounds:
        description: '總測試輪數（1–100）；每輪從起始列重跑'
        default: '1'
        required: true
        type: string
      expected_step:
        description: '自動接續使用，手動啟動請留空'
        default: ''
        type: string
      expected_date:
        description: '自動接續使用，手動啟動請留空'
        default: ''
        type: string
permissions:
  contents: write
  actions: write
concurrency:
  group: ${{ github.event_name == 'schedule' && 'website-watchdog' || ((inputs.mode == 'status' || inputs.mode == 'check_ip') && format('website-inspect-{0}', github.run_id) || 'single-row-website-global') }}
  cancel-in-progress: false
jobs:
  one-attempt:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python packages
        if: github.event_name != 'schedule' && inputs.mode != 'status'
        timeout-minutes: 5
        run: |
          python -m pip install --timeout 30 --retries 3 -r requirements.txt

      - name: Configure Ubuntu downloads
        if: github.event_name != 'schedule' && inputs.mode != 'status'
        timeout-minutes: 2
        run: |
          sudo tee /etc/apt/apt.conf.d/80-download-timeouts >/dev/null <<'EOF'
          Acquire::Retries "2";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF

          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi

      - name: Install Chromium and system dependencies
        if: github.event_name != 'schedule' && inputs.mode != 'status'
        timeout-minutes: 10
        run: |
          python -m playwright install --with-deps chromium
      - name: Run one attempt
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TARGET_URL: ${{ secrets.TARGET_URL }}
          EXCEL_PATH: data.xlsx
          SHEET_NAME: ${{ vars.SHEET_NAME }}
          MODE: ${{ inputs.mode }}
          BATCH_ID: ${{ inputs.batch_id }}
          START_ROW: ${{ inputs.start_row }}
          END_ROW: ${{ inputs.end_row }}
          MAX_RETRIES: ${{ inputs.max_retries }}
          MAX_ROUNDS: ${{ inputs.max_rounds }}
          MAX_RUNS: ${{ inputs.max_runs }}
          EXPECTED_DATE: ${{ inputs.expected_date }}
          EXPECTED_STEP: ${{ inputs.expected_step }}
        run: python -u auto_form_fill.py
      - name: Save result and error screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            本次結果.json
            錯誤畫面_*.png
          if-no-files-found: ignore
          retention-days: 14
